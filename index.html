<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Convertisseur Historique Des Opérations (.pdf vers .xlsx)</title>
    <style>
        body { font-family: sans-serif; background-color: #1e1e1e; color: #fff; padding: 50px; text-align: center; }
        .container { background: #2d2d2d; padding: 30px; border-radius: 8px; max-width: 500px; margin: auto; }
        h1 { color: #61dafb; }
        input[type="file"] { margin: 20px 0; }
        button { background-color: #4CAF50; color: white; border: none; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Convertir Mon Historique</h1>
        <form action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="fichier_pdf" accept=".pdf" required>
            <br><br>
            <button type="submit">Convertir en Excel</button>
        </form>
    </div>
</body>
</html>
